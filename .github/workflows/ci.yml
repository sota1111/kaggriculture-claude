name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q main.py scripts
      - run: bash scripts/build_submission.sh
      - run: test "$(tar -tzf submission.tar.gz)" = "main.py"
